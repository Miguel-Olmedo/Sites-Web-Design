<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão - Cadastro de Usuários</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS customizado (validação visual) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <!-- Navbar do Sistema -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-person-badge-fill me-2"></i>Sistema de Gestão
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-house-door me-1"></i>Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active fw-semibold" href="#"><i class="bi bi-person-plus me-1"></i>Cadastros</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#"><i class="bi bi-journal-text me-1"></i>Relatórios</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        
        <!-- Cartão do Formulário -->
        <div class="card shadow-sm border-0">
          <div class="card-header bg-white py-3 border-bottom border-primary border-3">
            <h4 class="card-title text-primary mb-0">
              <i class="bi bi-card-checklist me-2"></i>Formulário de Cadastro
            </h4>
            <small class="text-muted">Preencha os campos abaixo para registrar um novo usuário no sistema.</small>
          </div>

          <div class="card-body p-4">
            <form action="#" method="POST" class="needs-validation" novalidate>
              
              <!-- Seção 1: Dados Pessoais -->
              <h5 class="text-secondary mb-3 border-bottom pb-2">
                <i class="bi bi-person-vcard me-2"></i>Dados Pessoais
              </h5>
              
              <div class="row g-3 mb-4">
                <div class="col-md-8">
                  <label for="nome" class="form-label">Nome Completo</label>
                  <input type="text" class="form-control" id="nome" placeholder="Digite o nome completo" required>
                  <div class="invalid-feedback" id="erro-nome"></div>
                </div>
                
                <div class="col-md-4">
                  <label for="cpf" class="form-label">CPF</label>
                  <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                  <div class="invalid-feedback" id="erro-cpf"></div>
                </div>

                <div class="col-md-4">
                  <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                  <input type="date" class="form-control" id="dataNascimento" required>
                </div>

                <div class="col-md-4">
                  <label for="sexo" class="form-label">Gênero</label>
                  <select class="form-select" id="sexo" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="M">Masculino</option>
                    <option value="F">Feminino</option>
                    <option value="O">Outro / Prefiro não informar</option>
                  </select>
                  <div class="invalid-feedback" id="erro-sexo"></div>
                </div>

                <div class="col-md-4">
                  <label for="perfil" class="form-label">Tipo de Usuário</label>
                  <select class="form-select" id="perfil" required>
                    <option value="" selected disabled>Selecione...</option>
                    <option value="aluno">Aluno</option>
                    <option value="professor">Professor</option>
                    <option value="administrativo">Administrativo</option>
                  </select>
                  <div class="invalid-feedback" id="erro-perfil"></div>
                </div>
              </div>

              <!-- Seção 2: Contato e Acesso -->
              <h5 class="text-secondary mb-3 border-bottom pb-2">
                <i class="bi bi-envelope-at me-2"></i>Contato e Acesso
              </h5>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="email" class="form-label">E-mail</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" placeholder="usuario@email.com" required>
                  </div>
                  <div class="invalid-feedback" id="erro-email"></div>
                </div>

                <div class="col-md-6">
                  <label for="telefone" class="form-label">Telefone / WhatsApp</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="tel" class="form-control" id="telefone" placeholder="(00) 99999-9999" required>
                  </div>
                  <div class="invalid-feedback" id="erro-telefone"></div>
                </div>

                <div class="col-md-6">
                  <label for="senha" class="form-label">Senha de Acesso</label>
                  <input type="password" class="form-control" id="senha" minlength="6" placeholder="Mínimo 6 caracteres" required>
                  <div class="invalid-feedback" id="erro-senha"></div>
                </div>

                <div class="col-md-6">
                  <label for="confirmaSenha" class="form-label">Confirmar Senha</label>
                  <input type="password" class="form-control" id="confirmaSenha" placeholder="Repita a senha" required>
                  <div class="invalid-feedback" id="erro-confirmaSenha"></div>
                </div>
              </div>

              <!-- Seção 3: Informações Complementares -->
              <h5 class="text-secondary mb-3 border-bottom pb-2">
                <i class="bi bi-book me-2"></i>Informações Complementares
              </h5>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="curso" class="form-label">Área / Curso</label>
                  <select class="form-select" id="curso">
                    <option value="" selected disabled>Selecione uma opção...</option>
                    <option value="opcao1">Desenvolvimento de Software</option>
                    <option value="opcao2">Gestão Empresarial</option>
                    <option value="opcao3">Logística</option>
                    <option value="opcao4">Sistemas de Informação</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="periodo" class="form-label">Turno / Período</label>
                  <select class="form-select" id="periodo">
                    <option value="" selected disabled>Selecione o turno...</option>
                    <option value="matutino">Matutino</option>
                    <option value="vespertino">Vespertino</option>
                    <option value="noturno">Noturno</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="observacoes" class="form-label">Observações Gerais</label>
                  <textarea class="form-control" id="observacoes" rows="3" placeholder="Informações adicionais..."></textarea>
                </div>
              </div>

              <!-- Termos e Ações -->
              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" value="" id="termos" required>
                <label class="form-check-label" for="termos">
                  Declaro que as informações acima são verdadeiras.
                </label>
                <div class="invalid-feedback" id="erro-termos"></div>
              </div>

              <div class="d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-outline-secondary">
                  <i class="bi bi-x-circle me-1"></i>Limpar
                </button>
                <button type="submit" class="btn btn-primary px-4">
                  <i class="bi bi-check-circle me-1"></i>Salvar Cadastro
                </button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Validação customizada do formulário -->
  <script type="module" src="arquivos_js/functions/validacoes.js"></script>
  <script type="module" src="arquivos_js/main.js"></script>
</body>
</html>
